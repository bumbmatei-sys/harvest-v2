# Harvest V2 — CircleCI Free. No jobs deploy or send real messages.
# Push/PR pipelines run the fast workflow. The expensive final workflows are
# MANUAL ONLY: select the exact PR head branch, set full_review=true and
# expected_sha=<40-character SHA> and pr_number=<open PR number> in CircleCI's Trigger Pipeline dialog.
# The browser suite is sharded across parallel containers and build/PWA runs beside it.
# Neon migration verification is a separate manual run FROM main: select branch main and set
# neon_only=true, expected_sha=<PR head SHA> and pr_number=<PR number>. It runs only trusted main code
# and applies the PR's drizzle/ files to a disposable Neon branch, so the restricted harvest-neon-ci
# context only ever sees a main config and never needs a per-PR rule.
version: 2.1

orbs:
  browser-tools: circleci/browser-tools@2.4.2

parameters:
  full_review:
    type: boolean
    default: false
  expected_sha:
    type: string
    default: ""
  pr_number:
    type: integer
    default: 0
  neon_only:
    type: boolean
    default: false

commands:
  require_exact_head:
    description: Refuse any checkout that is not the explicitly selected, current PR head.
    steps:
      - run:
          name: Require explicitly selected exact PR head
          command: |
            set -euo pipefail
            if ! [[ "$REVIEW_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Set expected_sha to the full, lowercase 40-character PR head SHA."
              exit 1
            fi
            if [ "$(git rev-parse HEAD)" != "$REVIEW_EXPECTED_SHA" ] || [ "${CIRCLE_SHA1:-}" != "$REVIEW_EXPECTED_SHA" ]; then
              echo "The selected checkout does not match the intended PR HEAD; refusing stale validation."
              exit 1
            fi
            if [ -z "${CIRCLE_BRANCH:-}" ] || [ "$CIRCLE_BRANCH" = "main" ]; then
              echo "Select an open PR head branch, not main or a detached commit."
              exit 1
            fi
            if ! [[ "$REVIEW_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
              echo "Provide an open PR number for the final-review branch."
              exit 1
            fi
            pr_sha="$(git ls-remote origin "refs/pull/${REVIEW_PR_NUMBER}/head" | cut -f1)"
            branch_sha="$(git ls-remote origin "refs/heads/${CIRCLE_BRANCH}" | cut -f1)"
            if [ "$pr_sha" != "$REVIEW_EXPECTED_SHA" ] || [ "$branch_sha" != "$REVIEW_EXPECTED_SHA" ]; then
              echo "PR head or branch has changed; refusing stale final review."
              exit 1
            fi
            echo "Exact SHA selected for final review: $REVIEW_EXPECTED_SHA"

jobs:
  fast_checks:
    docker:
      - image: cimg/node:24
      - image: cimg/postgres:17.11
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-ci-only
          POSTGRES_DB: harvest_test
    resource_class: medium
    environment:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      DATABASE_URL_UNPOOLED: postgresql://postgres:local-ci-only@127.0.0.1:5432/harvest_test
      TEST_DATABASE_URL: postgresql://postgres:local-ci-only@127.0.0.1:5432/harvest_test
    steps:
      - checkout
      - run:
          name: Skip docs-only commits/PRs before installing dependencies
          command: |
            set -euo pipefail
            # Fetch main to calculate a branch's merge-base. The initial
            # checkout is owned by CircleCI and this fetch is read-only.
            git fetch --no-tags origin main:refs/remotes/origin/main --depth=100
            if [ "${CIRCLE_BRANCH:-}" = "main" ]; then
              if git rev-parse HEAD^ >/dev/null 2>&1; then
                changed="$(git diff --name-only HEAD^ HEAD)"
              else
                changed="bootstrap"
              fi
            elif git merge-base origin/main HEAD >/dev/null 2>&1; then
              changed="$(git diff --name-only "$(git merge-base origin/main HEAD)" HEAD)"
            else
              # Ambiguous shallow history must not silently skip real code.
              changed="unknown-code"
            fi
            if [ -n "$changed" ] && ! printf '%s\n' "$changed" | grep -Ev '^(docs/|.*\.md$)' >/dev/null; then
              echo "Documentation-only change: skipping hosted test work."
              circleci-agent step halt
            fi
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run:
          name: Apply and replay Postgres migrations
          command: |
            npm run db:migrate
            npm run db:migrate
      - run: npm run test:rls
      - run: npm run build

  browser_review:
    docker:
      - image: cimg/node:24-browsers
    # The full dev-server + Chromium suite approached 4 GiB and lost its server
    # on medium. Gen1 large (8 GiB, 20 credits/min) is available on Free.
    resource_class: large
    # Playwright splits the spec files across these containers (each runs its own
    # server and disposable database), so wall-clock time shrinks as the suite grows.
    parallelism: 4
    environment:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      REVIEW_EXPECTED_SHA: << pipeline.parameters.expected_sha >>
      REVIEW_PR_NUMBER: << pipeline.parameters.pr_number >>
    steps:
      - checkout
      - require_exact_head
      - run: npm ci
      - run: npx playwright install chromium
      - run:
          name: Browser tests (this container's shard)
          command: npx playwright test --shard="$((CIRCLE_NODE_INDEX + 1))/${CIRCLE_NODE_TOTAL}"
      # Store only failure evidence. An ordinary store_artifacts step always
      # executes; the run step packages files only if an earlier step failed.
      - run:
          name: Package failed browser test traces
          when: on_fail
          command: |
            mkdir -p /tmp/harvest-browser-failures
            if [ -d test-results ]; then
              tar -czf "/tmp/harvest-browser-failures/test-results-${CIRCLE_NODE_INDEX}.tar.gz" test-results
            fi
            if [ -d playwright-report ]; then
              tar -czf "/tmp/harvest-browser-failures/playwright-report-${CIRCLE_NODE_INDEX}.tar.gz" playwright-report
            fi
      - store_artifacts:
          path: /tmp/harvest-browser-failures
          destination: browser-failures

  build_pwa_review:
    docker:
      - image: cimg/node:24-browsers
    resource_class: large
    environment:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      REVIEW_EXPECTED_SHA: << pipeline.parameters.expected_sha >>
      REVIEW_PR_NUMBER: << pipeline.parameters.pr_number >>
    steps:
      - checkout
      - require_exact_head
      - run: npm ci
      - browser-tools/install_chrome
      - run: npx playwright install chromium
      - run: npm run build
      - run: npm run test:pwa

  # Runs from main (never from a PR branch). Only the candidate PR's drizzle/ files are copied in;
  # no PR script, dependency or config is executed.
  neon_review:
    docker:
      - image: cimg/node:24
    resource_class: medium
    environment:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      REVIEW_EXPECTED_SHA: << pipeline.parameters.expected_sha >>
      REVIEW_PR_NUMBER: << pipeline.parameters.pr_number >>
    steps:
      - checkout
      - run:
          name: Require a main pipeline and the exact current PR head
          command: |
            set -euo pipefail
            test "${CIRCLE_BRANCH:-}" = "main"
            [[ "$REVIEW_EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$REVIEW_PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
            test "$(git ls-remote origin "refs/pull/${REVIEW_PR_NUMBER}/head" | cut -f1)" = "$REVIEW_EXPECTED_SHA"
            git fetch --no-tags --depth=50 origin "refs/pull/${REVIEW_PR_NUMBER}/head"
            test "$(git rev-parse FETCH_HEAD)" = "$REVIEW_EXPECTED_SHA"
      - run:
          name: Use trusted main; take only the PR migration files
          command: |
            set -euo pipefail
            # Candidate SQL + Drizzle journal only, replacing main's drizzle/ exactly.
            # Never copy package.json, executable code or scripts from a PR into this privileged job.
            rm -rf drizzle
            git restore --source="$REVIEW_EXPECTED_SHA" --worktree --staged -- drizzle
            # Migration files must be plain files: no symlinks, at the top level or inside.
            if [ -L drizzle ] || find drizzle -type l | grep -q .; then
              echo "drizzle/ contains a symlink; refusing."
              exit 1
            fi
            npm ci --ignore-scripts
            touch /tmp/harvest-neon-trusted-ready
      - run:
          name: Confirm restricted Neon context (do not print secrets)
          command: |
            if [ -z "${NEON_API_KEY:-}" ] || [ -z "${NEON_PROJECT_ID:-}" ]; then
              echo "Required harvest-neon-ci context is missing NEON_API_KEY or NEON_PROJECT_ID."
              exit 1
            fi
      - run:
          name: Create disposable Neon CI branch
          command: npx tsx scripts/neon-ci.ts create
      - run:
          name: Apply Neon migration chain
          command: npm run db:migrate
      - run:
          name: Delete this job's disposable Neon CI branch
          when: always
          command: |
            # Trusted setup must finish before cleanup may execute.
            if [ -f /tmp/harvest-neon-trusted-ready ]; then
              npx tsx scripts/neon-ci.ts delete
            fi

  # Read-only checks of the deployed site after each main merge. Runs only for
  # main with the restricted harvest-prod-smoke context; never deploys, writes or
  # sends anything. See docs/setup/production-smoke.md.
  production_smoke:
    docker:
      - image: cimg/node:24-browsers
    resource_class: small
    environment:
      CI: "true"
      HARVEST_SMOKE_REQUIRE_SIGNED_IN: "1"
    steps:
      - checkout
      - run:
          name: Run only for trusted main
          command: |
            set -euo pipefail
            test "${CIRCLE_BRANCH:-}" = "main" || { echo "Production smoke runs only on main."; exit 1; }
      - run:
          name: Confirm harvest-prod-smoke context (names only, never values)
          command: |
            missing=""
            for name in HARVEST_SMOKE_BASE_URL HARVEST_SMOKE_SESSION_TOKEN HARVEST_SMOKE_EMAIL HARVEST_SMOKE_WORKSPACE; do
              [ -n "${!name:-}" ] || missing="$missing $name"
            done
            if [ -n "$missing" ]; then echo "harvest-prod-smoke is missing:$missing"; exit 1; fi
      - run:
          name: Wait for the deployed site to serve this commit
          no_output_timeout: 25m
          command: scripts/smoke-wait-for-deploy.sh "$CIRCLE_SHA1"
      - run:
          name: Install dependencies without package install scripts
          command: npm ci --ignore-scripts
      - run: npx playwright install chromium
      - run:
          name: Read-only production smoke tests
          command: npx playwright test --config playwright.smoke.config.ts
      - store_test_results:
          path: test-results/smoke

workflows:
  routine:
    unless:
      or:
        - << pipeline.parameters.full_review >>
        - << pipeline.parameters.neon_only >>
    jobs:
      - fast_checks

  final_review:
    when: << pipeline.parameters.full_review >>
    jobs:
      - browser_review
      - build_pwa_review

  # Manual, from main: verifies a PR's migrations on a disposable Neon branch.
  neon_migrations:
    when: << pipeline.parameters.neon_only >>
    jobs:
      - neon_review:
          context: harvest-neon-ci

  production_smoke:
    unless: << pipeline.parameters.full_review >>
    jobs:
      - production_smoke:
          context: harvest-prod-smoke
          filters:
            branches:
              only: main
